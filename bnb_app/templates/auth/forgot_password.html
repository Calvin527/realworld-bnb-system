{% extends 'base.html' %} {% block title %}Forgot Password | Makgobelo Lodge{%
endblock %} {% block content %}

<div class="auth-card">
  <h1>Forgot Password</h1>

  <form method="POST" class="form">
    <label>
      Secret Recovery Code
      <input
        type="text"
        name="recovery_code"
        placeholder="Example: A7K9-P2MX"
        required
      />
    </label>

    <label>
      New Password
      <input
        type="password"
        name="password"
        placeholder="Enter new password"
        required
      />
    </label>

    <label>
      Confirm New Password
      <input
        type="password"
        name="confirm_password"
        placeholder="Confirm new password"
        required
      />
    </label>

    <button class="btn" type="submit">Reset Password</button>
  </form>

  <div class="forgot-secret-area">
    <a
      href="{{ url_for('auth.forgot_secret_code') }}"
      class="btn btn-secondary"
    >
      Forgot Secret Code
    </a>
  </div>

  <p>
    <a href="{{ url_for('auth.login') }}">Back to Login</a>
  </p>
</div>

{% endblock %}
